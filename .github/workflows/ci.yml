name: CI

on:
  push:
    branches: [efcore/10.0]
  pull_request:
    branches: [efcore/10.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI_PACKAGE_VERSION: 10.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OceanBase.EntityFrameworkCore.slnx
      - name: Test
        run: dotnet test OceanBase.EntityFrameworkCore.slnx -c Release --no-restore -m:1 -nr:false
      - name: Pack
        run: >-
          dotnet pack src/OceanBase.EntityFrameworkCore/OceanBase.EntityFrameworkCore.csproj
          -c Release --no-restore "-p:PackageVersion=$env:CI_PACKAGE_VERSION"
          -o artifacts/ci -m:1 -nr:false
      - name: Verify package contents
        run: >-
          ./tests/OceanBase.EntityFrameworkCore.PackageConsumer/Verify-Package.ps1
          -PackagePath "artifacts/ci/OceanBase.EntityFrameworkCore.$env:CI_PACKAGE_VERSION.nupkg"
          -ExpectedVersion $env:CI_PACKAGE_VERSION
